<!doctype html>
<!--
  Sorgente della card social (og:image) usata dalle pagine senza `image:`.
  Non fa parte del sito: è il template da cui si rigenera l'immagine.

  Rigenerare dopo averlo modificato:

    ruby scripts/generate_og_card.rb

  (serve Chrome; lo script fa uno screenshot 1200x630 in
  assets/images/og-default.png)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter Variable";
    font-style: normal;
    font-weight: 100 900;
    src: url("../assets/fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
  }

  body {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    padding: 88px 96px;
    background: #050505;
    color: #eae4e4;
    font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Alone verde in alto a destra: lo stesso accento del sito. */
  .glow {
    position: absolute;
    top: -220px;
    right: -160px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 207, 83, 0.30), transparent 68%);
  }

  .kicker {
    position: relative;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a9a9b0;
  }

  .title {
    position: relative;
    margin: 0;
    font-size: 88px;
    font-weight: 800;
    line-height: 1.03;
    letter-spacing: -0.04em;
    color: #ffffff;
    max-width: 18ch;
  }

  .title .em { color: #10cf53; }

  .footer {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 12px;
    font-size: 28px;
    color: #a9a9b0;
  }

  .rule {
    width: 84px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, #10cf53, rgba(16, 207, 83, 0.15));
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <p class="kicker">Allan Nava — DevOps engineer</p>
  <h1 class="title">Tools and <span class="em">infrastructure</span> for live video.</h1>
  <div class="footer">
    <span class="rule"></span>
    <span>allan-nava.github.io</span>
  </div>
</body>
</html>
