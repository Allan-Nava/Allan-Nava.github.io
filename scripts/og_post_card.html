<!doctype html>
<!--
  Sorgente delle card social per-post (#131). Non fa parte del sito.

  Rigenerare tutte le card mancanti:

    ruby scripts/generate_og_cards.rb

  Il testo arriva dalla query string, così un solo template serve tutti i post:

    og_post_card.html?title=…&kicker=…&meta=…

  Stesso impianto grafico di og_card.html (la card generica), con il titolo del
  post al posto della frase fissa.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter Variable";
    font-style: normal;
    font-weight: 100 900;
    src: url("../assets/fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    padding: 84px 96px;
    background: #050505;
    color: #eae4e4;
    font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .glow {
    position: absolute;
    top: -220px;
    right: -160px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 207, 83, 0.30), transparent 68%);
  }

  .kicker {
    position: relative;
    margin: 0;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #10cf53;
  }

  /* Il titolo di un post può essere lungo quanto vuole: si taglia a 4 righe e
     la dimensione la sceglie lo script in base alla lunghezza, perché un
     `font-size` fisso o spezza il layout o spreca mezza card. */
  .title {
    position: relative;
    margin: 0;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.035em;
    color: #ffffff;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .footer {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 8px;
    font-size: 26px;
    color: #a9a9b0;
  }

  .rule {
    width: 84px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, #10cf53, rgba(16, 207, 83, 0.15));
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <p class="kicker" id="kicker"></p>
  <h1 class="title" id="title"></h1>
  <div class="footer">
    <span class="rule"></span>
    <span id="meta"></span>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var title = q.get('title') || '';
    document.getElementById('kicker').textContent = q.get('kicker') || 'Allan Nava';
    document.getElementById('meta').textContent = q.get('meta') || 'allan-nava.github.io';

    var el = document.getElementById('title');
    el.textContent = title;

    /* Scala il titolo sulla lunghezza: sotto i 32 caratteri sta comodo grande,
       oltre i 90 servirebbero più di 4 righe e va rimpicciolito. */
    var n = title.length;
    var size = n <= 32 ? 92 : n <= 56 ? 76 : n <= 90 ? 62 : 52;
    el.style.fontSize = size + 'px';
  </script>
</body>
</html>
