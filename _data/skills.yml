# Skills — the curated stack shown to recruiters and engineers.
#
# Replaces the "What I work with" tag cloud as the place that says what I can
# do: tags count posts, this says where each thing was actually used.
#
# Rule: only true facts. Every item says WHERE it was used, and the page shows
# it, so nothing reads bigger than it is:
#   where: work      used at work today (HiWay Media, in production)
#   where: earlier   used in production in a past role or period
#   where: projects  my own open-source projects, not production
#
# Fields per item:
#   name     what it is, as people search for it
#   where    work | earlier | projects (above)
#   detail   one line: what I did with it, concrete
#   repo     optional, a public repo under github.com/Allan-Nava that shows it
#
# Per group, `tile` is optional: the size of its tile in the home grid, as nava-ui's
# nv-tile modifiers (feature, w3, w4, w6, h2). Without it a tile takes a third of the row.
#
# The order of the groups and inside a group is the order on the page: strongest first.
# A change of fact (a tool used in production, a project dropped) goes here,
# in About, and in the CV in the same change.

legend:
  work: "At work, in production"
  earlier: "In production, in an earlier role"
  projects: "In my own projects"

groups:
