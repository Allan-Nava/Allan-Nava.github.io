      - name: Ansible
        where: work
        detail: Provisioning of the servers of the three data centres
      - name: Terraform and Terragrunt
        where: work
        detail: Automated creation of AWS accounts and CloudFront distributions
      - name: AWS
        where: work
        detail: CloudFront, and account creation with Terraform; the platforms themselves run on our own data centres
      - name: TeamCity
        where: work
        detail: Automated releases from build to Nomad
      - name: Linux
        where: work
        detail: The servers behind every platform, day to day
      - name: Kubernetes (k3s)
        where: projects
