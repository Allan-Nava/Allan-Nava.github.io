# GitHub → skills: how scripts/sync_skills.rb reads a public repository.
#
# A repo counts for a skill through its primary language (GitHub's own detection) or one of
# its topics. The skill name is either a name already in _data/skills.yml — then the repo is
# listed under it on /stack/ ("Also in …") — or a new one, which the script adds to `group` as
# a skill of its own, "In my own projects" (or "At work" when every repo using it is the
# hiway-media organisation's). Nothing here ever changes _data/skills.yml.
#
# Unmapped languages and topics are listed in the run's output: add a line here when one
# deserves a skill, or put it under `ignore`.

languages:
  Go: { skill: Go, group: languages }
  Java: { skill: Java, group: languages }
  Python: { skill: Python, group: languages }
  Shell: { skill: Bash, group: languages }
  Kotlin: { skill: Kotlin, group: languages }
  Swift: { skill: Swift, group: languages }
  PHP: { skill: PHP, group: languages }
  Dart: { skill: Flutter, group: languages }
  TypeScript: { skill: TypeScript, group: languages }
  JavaScript: { skill: JavaScript, group: languages }
  Rust: { skill: Rust, group: languages }
  Dockerfile: { skill: Docker, group: infrastructure }
  HCL: { skill: Terraform and Terragrunt, group: infrastructure }

