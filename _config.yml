# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Allan Nava
# `name` è quello che i template del tema stampano come firma (hero, brand della
# nav, footer, alt dell'avatar): senza, quelle stringhe restavano vuote.
name: Allan Nava
# `tagline` e' la seconda meta' del <title> della home ("Allan Nava — ..."):
# e' la riga che Google mostra come titolo del risultato per la query col nome.
tagline: "DevOps engineer building live video infrastructure"
email:
bio: A man who loves videogames and coding
# `description` NON e' decorativa: jekyll-seo-tag la usa come <meta name=description>
# e og:description su ogni pagina che non ne dichiara una propria, e finisce nello
# snippet di Google. Lasciandola vuota il sito girava con la sola bio del tema
# ("A man who loves videogames and coding"), che non contiene ne' il nome ne'
# una sola parola su cosa c'e' dentro: per la query "Allan Nava" non c'era nulla
# da agganciare. Tenerla sotto i ~155 caratteri, altrimenti Google la tronca.
description: "Allan Nava — DevOps engineer in Milan building live video infrastructure with Go, Docker and Kubernetes. Open source projects, notes and videos."
baseurl: "" # the subpath of your site, e.g. /blog (CI overrides it with --baseurl)
url: "https://allan-nava.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# if it's an external image, update below for true
# better with square images
external-image: false
picture: assets/images/profile.jpg
#
# Analytics (#124). ATTIVO da agosto 2026 su GA4: proprieta' "Allan Nava github
# pages - GA4", flusso web 5725926646, ID misurazione G-X841VQSHB8. La vecchia
# property Universal Analytics (UA-132362885-1) ha smesso di collezionare a
# luglio 2023 ed e' morta.
#
# `_includes/analytics-google.html` non carica nulla da localhost/127.0.0.1
# (niente statistiche da `jekyll serve`, da Lighthouse CI o dagli smoke test) e
# rispetta Do Not Track / Global Privacy Control. Verificato: con l'id attivo i
# punteggi Lighthouse restano 100 su tutte e quattro le categorie.
#
# Per spegnerlo: ricommentare la riga qui sotto (l'include non renderizza nulla
# se la chiave non e' valorizzata). Non serve toccare altro.
analytics-google: 'G-X841VQSHB8'
#
github_username: Allan-Nava
github: Allan-Nava
instagram: allan_nava
linkedin: allannava
youtube: '@allan_nava'
# `twitter` e' annidata perche' jekyll-seo-tag legge SOLO `site.twitter.username`:
# con la forma piatta emetteva <meta name="twitter:site" content="@"> su ogni
# pagina, cioe' una card senza attribuzione. `_includes/social-links.html` e'
# stato allineato a `site.twitter.username`.
twitter:
  username: allan__nava
dev: allannava
#
#
authors:
  allan:
    name: allan
    bio: A man who loves videogames and coding 
    external-image: false
    picture: assets/images/profile.jpg
#
# Identita' della persona dietro al sito (#SEO). `social.name` + `social.links`
# alimentano il JSON-LD Person di `_includes/schema-person.html`: sono le
# `sameAs` che dicono a Google che allan-nava.github.io, il profilo GitHub, il
# canale YouTube e LinkedIn sono la STESSA entita'. Senza, il sito e' un dominio
# anonimo che nomina un tale Allan Nava, e per la query col nome perde contro i
# profili social che quei segnali ce l'hanno. Ordine: il primo link e' quello
# piu' autorevole.
social:
  name: Allan Nava
  type: Person
  links:
    - https://github.com/Allan-Nava
    - https://www.linkedin.com/in/allannava/
    - https://www.youtube.com/@allan_nava
    - https://twitter.com/allan__nava
    - https://www.instagram.com/allan_nava/
    - https://dev.to/allannava
#
# Verifica della proprieta' in Google Search Console. jekyll-seo-tag emette da
# solo <meta name="google-site-verification"> quando questa chiave e' valorizzata.
# Il token si prende da https://search.google.com/search-console -> Aggiungi
# proprieta' -> "Prefisso URL" https://allan-nava.github.io/ -> metodo "Tag HTML":
# copiare SOLO il valore dell'attributo content. Senza Search Console non si puo'
# ne' vedere cosa e' indicizzato ne' chiedere l'indicizzazione di una URL.
# google_site_verification: "INCOLLA_QUI_IL_TOKEN"
#
# do you want a larger site? change the option below
# options: [normal, large] | default: normal
# normal = 560px / large = 810px
width: normal
# if you don't need pagination, comment the *paginate* configs below.
# NB: jekyll-paginate (v1) counts every post in _posts, including projects
# (hidden: true); blog/index.html filters those out, so the oldest pages
# (2019-era projects) render fewer than `paginate` items. Recent pages are full.
paginate: 10
paginate_path: "blog/:num/"
# if you don't need projects, comment the *projects* configs below
projects: true
# if you don't need "about" or "blog", comment them out below
about: true
blog: true
# extra pages: hiking map, workout PRs, gear list
map: true
fitness: false
gear: false
# extra content pages added in v2.1 (toggles only drive the footer links:
# the pages themselves live at /archive/, /videos/, /stats/, /search/)
archive: true
videos: true
stats: true
search: true
#
# Comments via GitHub Discussions. Fill repo-id and category-id from
# https://giscus.app (Discussions must be enabled on the repo and the giscus
# app installed); until then the include renders nothing.
# Commenti via GitHub Discussions (#123). Gli id NON si copiano da giscus.app:
# sono i node id GraphQL del repo e della categoria, e si rileggono con
#   gh api repos/:owner/:repo --jq .node_id
#   gh api graphql -f query='{repository(owner:"Allan-Nava",name:"Allan-Nava.github.io"){discussionCategories(first:20){nodes{id name}}}}'
# Categoria "Announcements": non answerable e solo i maintainer possono aprire
# discussioni: i thread li crea l'app giscus al primo commento.
giscus:
  repo: Allan-Nava/Allan-Nava.github.io
  repo-id: "MDEwOlJlcG9zaXRvcnkxNjUzNzQyNTc="
  category: Announcements
  category-id: "DIC_kwDOCdtpMc4DDkZW"
#
# do you want to show the "read time" of the posts?
read-time: true
# do you want to show the "tags" inside the posts?
show-tags: true
# related posts inside a post?
related: true
# Display links for next and previous posts for the specified categories
post-advance-links: [blog]
# show author block at the end of a post ?
show-author: true
#
# do you want some animations?
animation: true
#
plugins:
  # jekyll-feed rimosso (#160): `feed.xml` e `feed-projects.xml` sono scritti a
  # mano perche' il plugin non sa escludere i post `hidden: true` — meta' del
  # feed erano schede di repo generate da sync_github.rb. Quando un file occupa
  # gia' /feed.xml il suo generator salta, quindi tenerlo qui lasciava solo un
  # doppione silenzioso pronto a rientrare al primo rinomino.
  - jekyll-seo-tag
  - jekyll-gist
  - jemoji
  - jekyll-sitemap
  - jekyll-paginate
#
# Keep internal docs and repo housekeeping files out of the published site.
# Note: in Jekyll 3 setting `exclude` replaces the defaults, so Gemfile/vendor
# and friends are listed explicitly.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - docs
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - Rakefile
  - scripts
  - lighthouserc.json
#
