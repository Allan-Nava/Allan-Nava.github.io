# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Allan Nava
# `name` è quello che i template del tema stampano come firma (hero, brand della
# nav, footer, alt dell'avatar): senza, quelle stringhe restavano vuote.
name: Allan Nava
email:
bio: A man who loves videogames and coding
description: ""
baseurl: "" # the subpath of your site, e.g. /blog (CI overrides it with --baseurl)
url: "https://allan-nava.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# if it's an external image, update below for true
# better with square images
external-image: false
picture: assets/images/profile.jpg
#
# Analytics (#124). Oggi il sito NON raccoglie nulla: la vecchia property
# Universal Analytics (UA-132362885-1) ha smesso di collezionare a luglio 2023.
#
# Per riattivarlo servono 30 secondi e un id, il resto è già pronto:
#   1. analytics.google.com -> Amministrazione -> Crea -> Proprieta' (GA4)
#   2. dentro la proprieta': Flussi di dati -> Web -> aggiungi
#      https://allan-nava.github.io
#   3. copia l'ID misurazione, che ha la forma G-XXXXXXXXXX
#   4. togli il commento alla riga qui sotto e incollacelo
#
# `_includes/analytics-google.html` non carica nulla da localhost/127.0.0.1
# (niente statistiche da `jekyll serve`, da Lighthouse CI o dagli smoke test) e
# rispetta Do Not Track / Global Privacy Control. Verificato: con l'id attivo i
# punteggi Lighthouse restano 100 su tutte e quattro le categorie.
#analytics-google: ''
#
github_username: Allan-Nava
github: Allan-Nava
instagram: allan_nava
linkedin: allannava
youtube: '@allan_nava'
twitter: allan__nava
dev: allannava
#
#
authors:
  allan:
    name: allan
    bio: A man who loves videogames and coding 
    external-image: false
    picture: assets/images/profile.jpg
#
# do you want a larger site? change the option below
# options: [normal, large] | default: normal
# normal = 560px / large = 810px
width: normal
# if you don't need pagination, comment the *paginate* configs below.
# NB: jekyll-paginate (v1) counts every post in _posts, including projects
# (hidden: true); blog/index.html filters those out, so the oldest pages
# (2019-era projects) render fewer than `paginate` items. Recent pages are full.
paginate: 10
paginate_path: "blog/:num/"
# if you don't need projects, comment the *projects* configs below
projects: true
# if you don't need "about" or "blog", comment them out below
about: true
blog: true
# extra pages: hiking map, workout PRs, gear list
map: true
fitness: false
gear: false
# extra content pages added in v2.1 (toggles only drive the footer links:
# the pages themselves live at /archive/, /videos/, /stats/, /search/)
archive: true
videos: true
stats: true
search: true
#
# Comments via GitHub Discussions. Fill repo-id and category-id from
# https://giscus.app (Discussions must be enabled on the repo and the giscus
# app installed); until then the include renders nothing.
giscus:
  repo: Allan-Nava/Allan-Nava.github.io
  repo-id: ""
  category: Announcements
  category-id: ""
#
# do you want to show the "read time" of the posts?
read-time: true
# do you want to show the "tags" inside the posts?
show-tags: true
# related posts inside a post?
related: true
# Display links for next and previous posts for the specified categories
post-advance-links: [blog]
# show author block at the end of a post ?
show-author: true
#
# do you want some animations?
animation: true
#
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-gist
  - jemoji
  - jekyll-sitemap
  - jekyll-paginate
#
# Keep internal docs and repo housekeeping files out of the published site.
# Note: in Jekyll 3 setting `exclude` replaces the defaults, so Gemfile/vendor
# and friends are listed explicitly.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - docs
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - Rakefile
  - scripts
  - lighthouserc.json
#
