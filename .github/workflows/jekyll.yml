# Build and deploy the Jekyll site to GitHub Pages.
# Runs on every push to master and once a day (so future-dated posts get
# published without a manual push).
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  release:
    types: [published]
  schedule:
    - cron: '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # Pinned to the last release verified to provide Ruby 3.0 on this
        # runner; newer releases made the "Setup Ruby" step fail (run 28809149211).
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408
        with:
          # Keep in sync with the Gemfile.lock toolchain; bump together with
          # a `bundle update` of the github-pages gem.
          ruby-version: '3.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Validate posts
        run: ruby scripts/validate_posts.rb
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v4

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deploy smoke test of the live site (config: ../../checkfleet.yml).
  # checks.yml validates the locally built ./_site *before* the deploy, so until
  # this job nothing ever read what Pages actually serves — a deploy that
  # reports success while serving a wrong or partial page went unnoticed.
  # This cannot gate the deploy (it already happened); it exists to notify.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    name: Smoke test live site
    # Narrower than the workflow-level block: this job never touches Pages.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install checkfleet
        # Pinned release tarball — no Go toolchain needed, reproducible run.
        # Bump deliberately, like the ruby/setup-ruby pin above.
        env:
          CHECKFLEET_VERSION: '0.126.0'
        run: |
          curl -sSfL "https://github.com/Allan-Nava/checkfleet/releases/download/v${CHECKFLEET_VERSION}/checkfleet_${CHECKFLEET_VERSION}_linux_amd64.tar.gz" \
            | tar -xz checkfleet
          ./checkfleet version
      - name: Check the live site
        # `shell: bash` is required, not cosmetic: it enables pipefail, so the
        # --exit-on-bad exit code survives the pipe into tee instead of being
        # masked by tee's own 0.
        shell: bash
        # Pages sits behind Varnish with max-age=600. If this commit added a new
        # page *and* a target for it, the first run right after the deploy can
        # still read the cached 404 — the scheduled uptime.yml run clears it.
        run: |
          ./checkfleet check http --config checkfleet.yml \
            --output markdown --exit-on-bad | tee -a "$GITHUB_STEP_SUMMARY"
