# Build and deploy the Jekyll site to GitHub Pages.
# Runs on every push to master and once a day (so future-dated posts get
# published without a manual push).
#
# Deliberatamente NON si attiva sui tag né sulle release, per due motivi:
#
#   1. l'ambiente `github-pages` ha una protection rule che ammette solo il
#      branch di default, quindi un run partito da un tag muore con
#      "Tag vX.Y.Z is not allowed to deploy to github-pages";
#   2. il tag punta a un commit che sta già su master ed è già stato
#      pubblicato: il secondo run è un doppione che, per via del concurrency
#      group "pages" con cancel-in-progress, **cancella il deploy buono** di
#      master. È successo con v2.4.0.
#
# La release la crea `release.yml`, che non tocca Pages. Se un giorno servisse
# davvero deployare da un tag, va prima allargata la protection rule
# dell'ambiente (Settings → Environments → github-pages).
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  schedule:
    - cron: '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # Pinned to the last release verified to provide Ruby 3.0 on this
        # runner; newer releases made the "Setup Ruby" step fail (run 28809149211).
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          # Keep in sync with the Gemfile.lock toolchain; bump together with
          # a `bundle update` of the github-pages gem.
          ruby-version: '3.3'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Validate posts
        run: ruby scripts/validate_posts.rb
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v4

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deploy smoke test of the live site (config: ../../checkfleet.yml).
  # checks.yml validates the locally built ./_site *before* the deploy, so until
  # this job nothing ever read what Pages actually serves — a deploy that
  # reports success while serving a wrong or partial page went unnoticed.
  # This cannot gate the deploy (it already happened); it exists to notify.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    name: Smoke test live site
    # Narrower than the workflow-level block: this job never touches Pages.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install checkfleet
        # Pinned release tarball — no Go toolchain needed, reproducible run.
        # Bump deliberately, like the ruby/setup-ruby pin above.
        env:
          CHECKFLEET_VERSION: '0.126.0'
        run: |
          curl -sSfL "https://github.com/Allan-Nava/checkfleet/releases/download/v${CHECKFLEET_VERSION}/checkfleet_${CHECKFLEET_VERSION}_linux_amd64.tar.gz" \
            | tar -xz checkfleet
          ./checkfleet version
      - name: Check the live site
        shell: bash
        # Pages sits behind Varnish. Right after a deploy an URL can answer 5xx
        # while the CDN propagates: that happened on cf5734f, where `/gear/`
        # came back 503 while the other eleven targets were 200, and the job
        # went red on a site that was fine seconds later.
        #
        # checkfleet.yml already sets `retries: 2`, but those retry **ERROR**
        # findings (DNS, TLS, connection reset). A 503 is a **BAD** finding —
        # unexpected status — and is not retried. Hence the loop here: three
        # attempts, 20s apart. A page that is genuinely broken still fails all
        # three and the job still goes red, just ~40s later.
        #
        # Output goes to a file and is appended afterwards, instead of piping
        # into tee: the pipe used to mask checkfleet's exit code unless pipefail
        # was on, and with the retry loop we need that exit code per attempt.
        run: |
          ok=0
          for attempt in 1 2 3; do
            if ./checkfleet check http --config checkfleet.yml \
                 --output markdown --exit-on-bad > smoke.md; then
              ok=1
              break
            fi
            echo "smoke test: attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          cat smoke.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" -ne 1 ]; then exit 2; fi
