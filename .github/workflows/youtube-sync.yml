# Creates a blog post for every new video/short published on the YouTube
# channel, and reads recordingDetails.location so geolocated videos land on
# /map by themselves.
# Needs the YOUTUBE_API_KEY secret: the script aborts without it, there is no
# RSS fallback.
# Videos already embedded in an existing post are skipped, so hand-written
# posts are never duplicated. Because of that skip, a location added on YouTube
# after the post was created would never reach /map: scripts/resync_locations.rb
# runs right after and backfills lat/lng into the posts that already exist.
name: YouTube Sync

on:
  schedule:
    # Every 3 hours; a new video becomes a post within that window.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Sync videos published in the last N days"
        required: false
        default: "7"

permissions:
  contents: write
  actions: write

concurrency:
  group: "youtube-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate posts from the channel feed
        run: ruby scripts/sync_youtube.rb
        env:
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Le localita' taggate su YouTube DOPO la creazione del post: il passo
      # sopra salta i video gia' pubblicati, quindi senza questo un video
      # geolocalizzato in un secondo momento non arriverebbe mai su /map.
      # Costa 1 unita' di quota ogni 50 video.
      - name: Backfill locations on existing posts
        run: ruby scripts/resync_locations.rb
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Validate generated posts
        run: ruby scripts/validate_posts.rb
      - name: Commit and push new posts
        id: commit
        run: |
          if [ -z "$(git status --porcelain _posts)" ]; then
            echo "No new posts."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Sync posts and locations from YouTube"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy
        # Pushes made with GITHUB_TOKEN don't fire the push-triggered deploy
        # workflow, so dispatch it explicitly.
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run jekyll.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}

# Se il cron fallisce, apri (o aggiorna) una issue: nessuno guarda i run
# notturni, e un sync rotto resterebbe rotto in silenzio.
  report-failure:
    needs: [sync]
    if: failure()
    uses: ./.github/workflows/failure-issue.yml
    permissions:
      issues: write
