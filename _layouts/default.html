---
layout: compress
---
<!DOCTYPE html>
<html lang="en">
<head>

    {%- comment -%}
    charset per primo: la specifica lo vuole il prima possibile (entro 1024
    byte) e uno <script> davanti lo spinge più in là senza motivo. L'analytics
    non ha bisogno di stare in cima — carica il suo script da sé, in modo
    asincrono.
    {%- endcomment -%}
    <meta charset="utf-8">
    <meta http-equiv=X-UA-Compatible content="IE=edge,chrome=1">
    <meta name=viewport content="width=device-width, initial-scale=1">

    {% if site.analytics-google %}
        {% include analytics-google.html %}
    {% endif %}

    <meta name=description content="{{ site.bio }}">
    <meta name=author content="{{ site.name }}">

    {% seo %}

    {%- comment -%}
    jekyll-seo-tag emette og:image solo se la pagina ha `image:`: senza, i link
    condivisi arrivano senza anteprima. Qui si mette l'anteprima di riserva.

    In ordine: la card **per-post** con il titolo dentro (`page.og_card`, che
    assegna `_plugins/og_image.rb` quando il JPEG esiste in assets/images/og/),
    altrimenti la card generica, rigenerabile con
    `ruby scripts/generate_og_card.rb`.

    Perché `og_card` e non `image`: `image` è anche la thumbnail dei listing, e
    riempirla con una card 1200x630 rimpiazzerebbe i placeholder generativi di
    /blog e /projects. Lo stesso plugin cancella le `image: ""`, che il seo tag
    tratterebbe come URL relativo emettendo un og:image rotto.

    `twitter:card` lo lascia dichiarare al seo tag, per non emetterlo due volte.
    {%- endcomment -%}
    {% unless page.image and page.image != "" %}
    {% assign og_fallback = page.og_card | default: "/assets/images/og-default.png" %}
    <meta property="og:image" content="{{ site.url }}{{ og_fallback }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:image" content="{{ site.url }}{{ og_fallback }}">
    {% endunless %}
    
    {% include favicon.html %}

    {%- comment -%}
    Due meta per il colore della chrome del browser: è la baseline corretta
    quando il JS non parte e il tema lo decide il sistema. Se invece esiste una
    scelta esplicita, il JS di interactions.html sostituisce queste due con una
    meta unica — le media non possono seguire `data-theme`.
    {%- endcomment -%}
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" data-theme-color>
    <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" data-theme-color>

    {% include theme-init.html %}

    <link rel="manifest" href="{{ site.baseurl }}/manifest.webmanifest">

    <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/assets/fonts/inter-latin-wght-normal.woff2" crossorigin>

    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}{{ "/feed.xml" }}" />

    <style>
    {% capture scss_sheet %}{% include style.scss %}{% endcapture %}
    {{ scss_sheet | scssify }}
    </style>

</head>
<body>

    {% include nav.html %}

    {%- comment -%} <main> e non <div>: Lighthouse (landmark-one-main) e i lettori di schermo si aspettano un landmark principale {%- endcomment -%}
    {%- comment -%}
    `wide: true` nel front matter allarga il contenitore: serve ai listing
    (home, blog, projects, videos), che scorrono una griglia invece di far
    leggere un testo continuo. Tutto il resto resta sulla misura di `site.width`.
    {%- endcomment -%}
    <main id="content" class="{% if page.wide %}wrapper-wide{% else %}wrapper-{% if site.width == "normal" %}normal{% elsif site.width == "large" %}large{% endif %}{% endif %}">
        {% if page.tag %}
            <div class="post">
        {% else %}
            {% if showHeader != true %}
                <div class="page {{ page.title | downcase }}">
            {% else %}
                <div class="{{ page.title | downcase }}">
            {% endif %}
        {% endif %}

            {{ content }}
        </div>
    </main>

    <a class="to-top" href="#content" aria-label="Back to top" title="Back to top"><span aria-hidden="true">↑</span></a>

    {% include icons.html %}

    {% include interactions.html %}

    {% include pwa.html %}

    {% if page.tag %}{% include youtube-facade.html %}{% include lightbox.html %}{% endif %}

</body>
</html>
